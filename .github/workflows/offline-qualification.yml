name: UIF offline qualification

# Runs the existing source-only checks. This does not deploy or prove live recovery.
"on":
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/offline-qualification.yml
      - config/white-room.json
      - config/windmill/**
      - tools/white_room/**
      - tools/windmill/**
      - tests/white_room/**
      - tests/windmill/**
      - AGENTS.md
      - .agents/**
      - docs/agents/**
      - docs/operating-procedure.md
      - docs/project-integration.md
      - docs/white-room/**
      - tools/agents/**
      - tools/delivery/**
      - src/**
      - tests/agents/**
      - tests/delivery/**
      - pyproject.toml
  push:
    branches: [feature/foo-windmill-config-recreation]
    paths:
      - .github/workflows/offline-qualification.yml
      - config/white-room.json
      - config/windmill/**
      - tools/white_room/**
      - tools/windmill/**
      - tests/white_room/**
      - tests/windmill/**
      - AGENTS.md
      - .agents/**
      - docs/agents/**
      - docs/white-room/**
      - tools/agents/**
      - tools/delivery/**
      - src/**
      - tests/agents/**
      - tests/delivery/**
      - pyproject.toml

permissions:
  contents: read

jobs:
  offline-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up declared Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record tested source identity
        run: |
          python --version
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Run Windmill unit tests
        run: python -m unittest discover -s tests/windmill -v
      - name: Run white-room unit tests
        run: python -m unittest discover -s tests/white_room -v
      - name: Validate environment policy and conformance tests
        run: |
          python tools/agents/check_policy.py --bundle .
          python -m unittest discover -s tests/agents -v
      - name: Run source-only handoff and drift tests
        run: python -m unittest discover -s tests/delivery -v
      - name: Build and smoke-test the isolated package
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/uif-wheels" .
          python -m venv "$RUNNER_TEMP/uif-smoke"
          "$RUNNER_TEMP/uif-smoke/bin/python" -m pip install --no-index "$RUNNER_TEMP/uif-wheels/"*.whl
          "$RUNNER_TEMP/uif-smoke/bin/python" -I -c "from uif.white_room.transition import WhiteRoomVerifier; from uif.quota_handoff import Registry"
          "$RUNNER_TEMP/uif-smoke/bin/uif-quota-handoff" --help
      - name: Validate and plan offline configuration
        run: |
          python tools/windmill/white_room.py validate
          python tools/windmill/white_room.py plan
      - name: Qualify isolated synthetic recreation
        run: |
          output_root="$(mktemp -d)"
          python tools/windmill/white_room.py recreate-mock --output "$output_root/synthetic"
      - name: Compile source and tests
        run: python -m compileall -q src tools tests
